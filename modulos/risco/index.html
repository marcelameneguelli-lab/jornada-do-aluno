<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alunos em risco · Jornada do Aluno</title>
<link rel="icon" type="image/png" href="../../icones/icon-64.png">
<link rel="stylesheet" href="../../nucleo/estilo.css?v=1.2.9">
<style>
  body { background: var(--fundo); }
  [hidden] { display: none !important; }
  .topo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 22px; background: #fff; border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 5; }
  .topo h1 { font-size: 19px; margin: 0; } .topo small { display: block; color: var(--texto-2); font-size: 12px; }
  .periodos { display: flex; margin-left: auto; border: 1px solid var(--borda); border-radius: 8px; overflow: hidden; }
  .periodos button { border: 0; background: #fff; padding: 8px 16px; font: inherit; font-weight: 600; color: var(--texto-2); cursor: pointer; }
  .periodos button + button { border-left: 1px solid var(--borda); }
  .periodos button.ativo { background: var(--azul); color: #fff; }
  main { padding: 18px 22px; }
  .lembrete { background: #eef5fc; border: 1px solid #b9d4ef; border-radius: 8px; padding: 9px 13px; font-size: 13px; margin-bottom: 14px; color: #1d4b7a; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { background: #fff; border: 1px solid var(--borda); border-radius: 10px; padding: 12px 14px; border-top: 4px solid var(--cor, #8aa); cursor: pointer; }
  .card.sel { box-shadow: 0 0 0 2px var(--azul) inset; }
  .card b { display: block; font-size: 24px; } .card span { font-size: 12px; color: var(--texto-2); }
  .sinais-filtro { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .sinais-filtro button { border: 1px solid var(--borda); background: #fff; border-radius: 14px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .sinais-filtro button.sel { background: var(--azul); color: #fff; border-color: var(--azul); }
  .sinais-filtro em { font-style: normal; font-weight: 700; margin-left: 4px; }
  .filtros { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .filtros input, .filtros select { width: auto; margin: 0; padding: 7px 10px; font-size: 13px; }
  .filtros input[type=search] { min-width: 230px; }
  .total { margin-left: auto; color: var(--texto-2); font-size: 13px; }
  .tabela td.nome b { display: block; } .tabela td.nome small { color: var(--texto-2); font-family: Consolas, monospace; }
  .tabela tr.clicavel { cursor: pointer; } .tabela tr.clicavel:hover td { background: #f7f9fc; }
  .chip { display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; margin: 2px 3px 2px 0; white-space: nowrap; }
  .c-financeiro { background: #fde8e8; color: #b42318; } .c-evasao { background: #fff4e5; color: #93370d; }
  .c-provas { background: #e7f0fb; color: #1d4b7a; } .c-estagio { background: #f3f0ff; color: #5f3dc4; }
  .c-financiamentos { background: #e6f6ea; color: #1e7a38; } .c-renovacao { background: #e6fcf5; color: #0b7285; } .c-engajamento { background: #f1f3f5; color: #495057; }
  .tag-formando { display: inline-block; background: #fff3bf; color: #7a5b00; border: 1px solid #ffe066; border-radius: 10px; padding: 0 7px; font-size: 11px; font-weight: 700; margin-left: 6px; }
  .areas { font-weight: 700; font-size: 18px; text-align: center; }
  .sem-contato { color: #b54708; font-weight: 600; }
  .modal-caixa.larga { max-width: 720px; }
  .grupo { border: 1px solid var(--borda); border-radius: 10px; padding: 10px 12px; margin-top: 10px; display: flex; gap: 12px; align-items: flex-start; }
  .grupo > div { flex: 1; } .grupo h4 { margin: 0 0 4px; font-size: 14px; } .grupo ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .barras { display: grid; gap: 6px; } .barra { display: grid; grid-template-columns: 220px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; }
  .barra i { display: block; height: 10px; border-radius: 5px; background: var(--azul); } .barra em { font-style: normal; text-align: right; font-weight: 700; }
  .carregando-base { padding: 40px; text-align: center; color: var(--texto-2); }
  @media (max-width: 860px) { main { padding: 14px 10px; } .periodos { margin-left: 0; } .barra { grid-template-columns: 140px 1fr 34px; } }
</style>
</head>
<body>
<div class="topo">
  <div><h1>🚨 Alunos em risco</h1><small id="sub">Quem acumula sinais em vários sistemas, do mais urgente para o menos</small></div>
  <div class="periodos" id="periodos"><button data-p="impar" class="ativo">Ímpar</button><button data-p="par">Par</button><button data-p="ct">Técnico</button></div>
</div>
<main id="area"><div class="carregando-base">Cruzando os sistemas...</div></main>
<div id="modal" hidden><div class="modal-caixa larga" id="modal-corpo"></div></div>

<script src="../../nucleo/config.js?v=1.7.0"></script>
<script src="../../nucleo/api.js?v=1.2.3"></script>
<script>window.App = (window.parent && window.parent !== window) ? window.parent.App : null;</script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const NOME_P = { impar: 'Ímpar', par: 'Par', ct: 'Técnico' };
  const NOME_SIS = { financeiro: 'Cobrança', evasao: 'Evasão', provas: 'Provas', estagio: 'Estágio', financiamentos: 'Financiamentos', renovacao: 'Renovação', engajamento: 'Engajamento' };
  const aviso = (msg, tipo) => { if (window.App && window.App.aviso) return window.App.aviso(msg, tipo); alert(msg); };
  const dataBR = (ts) => ts ? new Date(ts).toLocaleDateString('pt-BR') : '';
  const dias = (ts) => ts ? Math.floor((Date.now() - ts) / 864e5) : null;
  const E = { periodo: 'impar', d: {}, fAreas: '', fSinal: '', busca: '', fCurso: '', fContato: '', fForm: false, me: {} };
  const D = () => E.d[E.periodo] || { alunos: [], sinais: {} };

  async function carregar(base) {
    try {
      const r = await Api.chamar('risco.lista', { base }, { timeout: 180000 });
      if (!r || !r.ok) throw new Error((r && r.erro) || 'Não foi possível montar o painel.');
      E.d[base] = r;
    } catch (e) { if (!e.auth) aviso(e.message, 'erro'); E.d[base] = E.d[base] || { alunos: [], sinais: {} }; }
  }

  const sis = (id) => (D().sinais[id] || {}).sistema || '';
  const rot = (id) => (D().sinais[id] || {}).rotulo || id;
  const chip = (x) => `<span class="chip c-${sis(x.id)}" title="${esc(x.det)}">${esc(rot(x.id))}</span>`;

  function filtrar() {
    const b = E.busca.trim().toLowerCase();
    return D().alunos.filter((a) => {
      if (E.fAreas === '3' && a.areas < 3) return false;
      if (E.fAreas === '2' && a.areas !== 2) return false;
      if (E.fAreas === '1' && a.areas !== 1) return false;
      if (E.fSinal && !a.sinais.some((x) => x.id === E.fSinal)) return false;
      if (E.fCurso && a.curso !== E.fCurso) return false;
      if (E.fForm && !a.formando) return false;
      if (E.fContato === 'nunca' && a.contato) return false;
      if (E.fContato === '15' && a.contato && dias(a.contato.ts) < 15) return false;
      if (b && a.nome.toLowerCase().indexOf(b) < 0 && a.mat.indexOf(b) < 0) return false;
      return true;
    });
  }

  function desenhar() {
    document.querySelectorAll('#periodos button').forEach((x) => x.classList.toggle('ativo', x.dataset.p === E.periodo));
    const L = D().alunos, F = filtrar();
    const n = (f) => L.filter(f).length;
    const porSinal = {}; L.forEach((a) => a.sinais.forEach((x) => { porSinal[x.id] = (porSinal[x.id] || 0) + 1; }));
    const cursos = Array.from(new Set(L.map((a) => a.curso))).filter(Boolean).sort();
    const porSis = {}; L.forEach((a) => Array.from(new Set(a.sinais.map((x) => sis(x.id)))).forEach((s) => { porSis[s] = (porSis[s] || 0) + 1; }));
    const maxS = Math.max(1, ...Object.values(porSis));
    $('#sub').textContent = `${NOME_P[E.periodo]} · ${L.length} aluno(s) com algum sinal, de ${D().total || 0} na base`;
    $('#area').innerHTML = `
      <div class="lembrete">Cada aluno aparece uma vez, com todos os sinais juntos. A lista começa por quem tem sinais em mais áreas (cobrança, evasão, provas, estágio, financiamento, renovação). Abra o aluno para ver o detalhe e ir ao sistema certo.</div>
      <div class="cards">
        <div class="card ${E.fAreas === '3' ? 'sel' : ''}" data-areas="3" style="--cor:#d92d20"><b>${n((a) => a.areas >= 3)}</b><span>Sinais em 3 ou mais áreas</span></div>
        <div class="card ${E.fAreas === '2' ? 'sel' : ''}" data-areas="2" style="--cor:#f79009"><b>${n((a) => a.areas === 2)}</b><span>Sinais em 2 áreas</span></div>
        <div class="card ${E.fAreas === '1' ? 'sel' : ''}" data-areas="1" style="--cor:#1c7ed6"><b>${n((a) => a.areas === 1)}</b><span>Sinal em 1 área</span></div>
        <div class="card ${E.fContato === 'nunca' ? 'sel' : ''}" data-contato="nunca" style="--cor:#868e96"><b>${n((a) => !a.contato)}</b><span>Nunca contatados na Jornada</span></div>
      </div>
      <div class="sinais-filtro">${Object.keys(D().sinais).filter((k) => porSinal[k]).sort((a, b) => porSinal[b] - porSinal[a]).map((k) => `<button data-sinal="${k}" class="${E.fSinal === k ? 'sel' : ''}">${esc(rot(k))}<em>${porSinal[k]}</em></button>`).join('')}</div>
      <div class="filtros">
        <input type="search" id="busca" placeholder="Nome ou matrícula" value="${esc(E.busca)}">
        <select id="f-curso"><option value="">Todos os cursos</option>${cursos.map((c) => `<option ${E.fCurso === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        <select id="f-contato"><option value="">Qualquer contato</option><option value="nunca" ${E.fContato === 'nunca' ? 'selected' : ''}>Nunca contatado</option><option value="15" ${E.fContato === '15' ? 'selected' : ''}>Sem contato há 15 dias ou mais</option></select>
        <label style="display:flex;gap:6px;align-items:center;margin:0;font-size:13px"><input type="checkbox" id="f-form" ${E.fForm ? 'checked' : ''} style="width:auto;margin:0"> Só formandos</label>
        <button class="btn" id="limpar">Limpar</button><button class="btn" id="exportar">📥 Exportar</button>
        <span class="total">${F.length} aluno(s)</span>
      </div>
      <div class="painel"><table class="tabela"><thead><tr><th>Aluno</th><th>Curso</th><th>Áreas</th><th>Sinais</th><th>Último contato na Jornada</th></tr></thead>
      <tbody>${F.slice(0, 400).map((a) => `<tr class="clicavel" data-mat="${esc(a.mat)}">
        <td class="nome"><b>${esc(a.nome || a.mat)}${a.formando ? '<span class="tag-formando">🎓 Formando</span>' : ''}</b><small>${esc(a.mat)}</small></td><td>${esc(a.curso)}</td>
        <td class="areas">${a.areas}</td><td>${a.sinais.map(chip).join('')}</td>
        <td><small>${a.contato ? `${esc(a.contato.quem)} · ${esc(a.contato.onde)}<br>${dataBR(a.contato.ts)} (${dias(a.contato.ts)} dia(s))` : '<span class="sem-contato">nunca</span>'}</small></td></tr>`).join('') || '<tr><td colspan="5" class="vazio">Nenhum aluno com esses filtros.</td></tr>'}</tbody></table>
      ${F.length > 400 ? '<p class="dica" style="padding:8px 12px">Mostrando os 400 primeiros. Use os filtros ou exporte a lista completa.</p>' : ''}</div>
      <div class="painel" style="margin-top:14px"><h2>Alunos com sinal, por área</h2><div class="barras">${Object.keys(porSis).sort((a, b) => porSis[b] - porSis[a]).map((s) => `<div class="barra"><span>${esc(NOME_SIS[s] || s)}</span><i style="width:${porSis[s] / maxS * 100}%"></i><em>${porSis[s]}</em></div>`).join('')}</div></div>`;
    document.querySelectorAll('[data-areas]').forEach((c) => { c.onclick = () => { E.fAreas = E.fAreas === c.dataset.areas ? '' : c.dataset.areas; desenhar(); }; });
    document.querySelectorAll('[data-contato]').forEach((c) => { c.onclick = () => { E.fContato = E.fContato === c.dataset.contato ? '' : c.dataset.contato; desenhar(); }; });
    document.querySelectorAll('[data-sinal]').forEach((c) => { c.onclick = () => { E.fSinal = E.fSinal === c.dataset.sinal ? '' : c.dataset.sinal; desenhar(); }; });
    const busca = $('#busca'); busca.oninput = () => { E.busca = busca.value; const pos = busca.selectionStart; desenhar(); const x = $('#busca'); x.focus(); x.setSelectionRange(pos, pos); };
    $('#f-curso').onchange = (e) => { E.fCurso = e.target.value; desenhar(); };
    $('#f-contato').onchange = (e) => { E.fContato = e.target.value; desenhar(); };
    $('#f-form').onchange = (e) => { E.fForm = e.target.checked; desenhar(); };
    $('#limpar').onclick = () => { Object.assign(E, { fAreas: '', fSinal: '', busca: '', fCurso: '', fContato: '', fForm: false }); desenhar(); };
    $('#exportar').onclick = () => exportar(F);
    document.querySelectorAll('tr[data-mat]').forEach((tr) => { tr.onclick = () => abrir(tr.dataset.mat); });
  }

  function abrir(mat) {
    const a = D().alunos.filter((x) => x.mat === mat)[0]; if (!a) return;
    const grupos = {}; a.sinais.forEach((x) => { const s = sis(x.id); (grupos[s] = grupos[s] || []).push(x); });
    const pode = (s) => { const l = E.me.sistemas || []; return l.indexOf('todos') >= 0 || l.indexOf(s) >= 0; };
    $('#modal-corpo').innerHTML = `<h2>${esc(a.nome || a.mat)}${a.formando ? '<span class="tag-formando">🎓 Formando</span>' : ''}</h2>
      <p class="dica" style="margin-top:-6px">${esc(a.mat)} · ${esc(a.curso)}${a.cel ? ' · ' + esc(a.cel) : ''}${a.email ? ' · ' + esc(a.email) : ''}</p>
      <p style="margin:6px 0 0;font-size:13px">Último contato na Jornada: ${a.contato ? `<b>${esc(a.contato.quem)}</b> (${esc(a.contato.onde)}) em ${dataBR(a.contato.ts)}${a.contato.oque ? ' (' + esc(a.contato.oque) + ')' : ''}` : '<span class="sem-contato">nenhum registrado</span>'}</p>
      ${Object.keys(grupos).map((s) => `<div class="grupo"><div><h4>${esc(NOME_SIS[s] || s)}</h4><ul>${grupos[s].map((x) => `<li>${esc(rot(x.id))}${x.det ? ` · <span class="dica">${esc(x.det)}</span>` : ''}</li>`).join('')}</ul></div>
        ${s !== 'engajamento' && pode(s) ? `<button class="btn mini" data-ir="${s}">Abrir ${esc(NOME_SIS[s] || s)}</button>` : ''}</div>`).join('')}
      <p class="dica">Os registros de contato são feitos no sistema de cada área. Pesquise o aluno pela matrícula lá.</p>
      <div class="botoes"><button type="button" class="btn" data-fechar>Fechar</button></div>`;
    $('#modal').hidden = false;
    document.querySelector('[data-fechar]').onclick = fechar;
    document.querySelectorAll('[data-ir]').forEach((b) => { b.onclick = () => {
      try { navigator.clipboard.writeText(a.mat); } catch (e) { /* sem área de transferência */ }
      try { window.parent.location.hash = '#/s/' + b.dataset.ir; } catch (e) { /* fora da Jornada */ }
      aviso('Matrícula copiada: cole na busca do sistema.', 'ok');
    }; });
  }
  function fechar() { $('#modal').hidden = true; $('#modal-corpo').innerHTML = ''; }

  function exportar(F) {
    const cel = (v) => { const t = String(v == null ? '' : v); return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    const linhas = [['Matrícula', 'Aluno', 'Curso', 'Formando', 'Celular', 'E-mail', 'Áreas', 'Sinais', 'Último contato', 'Por', 'Onde']].concat(F.map((a) => [a.mat, a.nome, a.curso, a.formando ? 'Sim' : '', a.cel, a.email, a.areas,
      a.sinais.map((x) => rot(x.id) + (x.det ? ' (' + x.det + ')' : '')).join(' | '), a.contato ? dataBR(a.contato.ts) : '', a.contato ? a.contato.quem : '', a.contato ? a.contato.onde : '']));
    const csv = '﻿' + linhas.map((l) => l.map(cel).join(';')).join('\r\n');
    const el = document.createElement('a'); el.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    el.download = 'alunos_em_risco_' + E.periodo + '_' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(el); el.click(); el.remove();
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const s = Api.Sessao.ler();
    if (!s) { if (window.App) window.App.mostrarLogin('Entre novamente.'); return; }
    E.me = s.me || {};
    document.querySelectorAll('#periodos button').forEach((b) => { b.onclick = async () => {
      E.periodo = b.dataset.p;
      if (!E.d[E.periodo]) { $('#area').innerHTML = '<div class="carregando-base">Cruzando os sistemas...</div>'; await carregar(E.periodo); }
      desenhar();
    }; });
    $('#modal').onclick = (ev) => { if (ev.target.id === 'modal') fechar(); };
    await carregar(E.periodo); desenhar();
  });
  window.TelaRisco = { estado: E, desenhar };
})();
</script>
</body>
</html>
