<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento · Jornada do Aluno</title>
<link rel="icon" type="image/png" href="../../icones/icon-192.png">
<link rel="stylesheet" href="../../nucleo/estilo.css?v=1.1.0">
<style>
  body { background: var(--fundo); }
  .importar-central { max-width: 620px; margin: 10px auto; padding: 20px; }
  .importar-central h3 { margin: 0 0 8px; }
  .importar-central p { color: #5b6676; font-size: 13px; line-height: 1.5; }
  [hidden] { display: none !important; } /* o estilo geral de input não pode mostrar o campo de arquivo escondido */
  .topo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 22px; background: #fff; border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 5; }
  .topo h1 { font-size: 19px; margin: 0; }
  .topo small { display: block; color: var(--texto-2); font-size: 12px; }
  .bases { display: flex; gap: 6px; margin-left: auto; }
  .bases button { border: 1px solid var(--borda); background: #fff; padding: 7px 12px; border-radius: 20px; font: inherit; font-size: 13px; cursor: pointer; }
  .bases button.ativa { background: var(--azul); color: #fff; border-color: var(--azul); }
  .bases button.ativa.par { background: #2b8a3e; border-color: #2b8a3e; }
  .bases button.ativa.ct { background: #e8590c; border-color: #e8590c; }
  .sync { font-size: 12px; color: var(--texto-2); white-space: nowrap; }
  .sync b { color: var(--verde-escuro); }
  .abas { display: flex; gap: 4px; padding: 0 22px; background: #fff; border-bottom: 1px solid var(--borda); overflow-x: auto; }
  .abas button { border: 0; background: none; padding: 11px 14px; font: inherit; font-weight: 600; color: var(--texto-2); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .abas button.ativa { color: var(--azul); border-bottom-color: var(--verde); }
  .abas .cont { background: var(--azul-claro); color: var(--azul); border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }
  main { padding: 18px 22px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .filtros input, .filtros select { width: auto; margin: 0; padding: 7px 10px; font-size: 13px; }
  .filtros input[type=search] { min-width: 240px; }
  .total { margin-left: auto; color: var(--texto-2); font-size: 13px; }
  .tabela td.nome b { display: block; } .tabela td.nome small { color: var(--texto-2); font-family: Consolas, monospace; }
  .tabela tr.clicavel { cursor: pointer; } .tabela tr.clicavel:hover td { background: #f7f9fc; }
  .alerta { color: var(--erro); font-weight: 700; }
  .paginas { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 10px; font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: #fff; border: 1px solid var(--borda); border-radius: var(--raio); padding: 14px 16px; border-top: 3px solid var(--azul); }
  .kpi span { font-size: 12px; color: var(--texto-2); text-transform: uppercase; letter-spacing: .4px; }
  .kpi b { display: block; font-size: 24px; color: var(--azul); margin-top: 4px; }
  .kpi small { color: var(--texto-2); }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .barra { display: grid; grid-template-columns: 170px 1fr 48px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
  .barra .trilho { background: #edf1f6; border-radius: 4px; height: 12px; overflow: hidden; }
  .barra .trilho i { display: block; height: 100%; background: var(--azul); border-radius: 4px; }
  .dias { display: flex; align-items: flex-end; gap: 4px; height: 130px; padding-top: 10px; }
  .dias div { flex: 1; text-align: center; font-size: 10px; color: var(--texto-2); }
  .dias i { display: block; background: var(--verde); border-radius: 3px 3px 0 0; margin: 0 auto 3px; width: 70%; min-height: 2px; }
  .grupo-fu { margin-bottom: 16px; } .grupo-fu h3 { font-size: 14px; margin: 0 0 8px; }
  .fu { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--borda); border-left: 4px solid var(--azul); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
  .fu.atrasado { border-left-color: var(--erro); } .fu.hoje { border-left-color: var(--amarelo); }
  .fu div { flex: 1; } .fu small { color: var(--texto-2); display: block; }
  .modal-caixa.larga { max-width: 760px; }
  .ficha-aluno { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 14px; background: #f7f9fc; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .ficha-aluno span { color: var(--texto-2); font-size: 11px; display: block; }
  .contatos { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .contatos a { text-decoration: none; }
  .hist { max-height: 210px; overflow-y: auto; margin-bottom: 12px; }
  .hist div { border-left: 3px solid var(--verde); padding: 6px 10px; margin-bottom: 6px; background: #fafbfd; border-radius: 0 6px 6px 0; font-size: 13px; }
  .hist small { color: var(--texto-2); }
  .grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  textarea { display: block; width: 100%; margin-top: 5px; padding: 9px 11px; border: 1px solid var(--borda); border-radius: 8px; font: inherit; min-height: 70px; }
  .secao { font-size: 13px; font-weight: 700; color: var(--azul); margin: 14px 0 8px; text-transform: uppercase; letter-spacing: .4px; }
  iframe.original { border: 0; width: 100%; height: calc(100vh - 120px); background: #fff; border-radius: var(--raio); }
  .carregando-base { padding: 40px; text-align: center; color: var(--texto-2); }
  @media (max-width: 820px) { .duas, .grade2 { grid-template-columns: 1fr; } .bases { margin-left: 0; } main { padding: 14px 10px; } }
</style>
</head>
<body>
<div class="topo">
  <div><h1 id="titulo">Acompanhamento</h1><small id="subtitulo"></small></div>
  <div class="bases" id="bases">
    <button data-base="impar">📘 Ímpar</button><button data-base="par">📗 Par</button><button data-base="ct">📙 Técnico</button>
  </div>
  <div class="sync" id="sync">Conectando...</div>
</div>
<nav class="abas" id="abas">
  <button data-aba="alunos" class="ativa">Alunos</button>
  <button data-aba="followup">Follow-up <span class="cont" id="cont-fu">0</span></button>
  <button data-aba="dashboard">Dashboard</button>
  <button data-aba="produtividade">Produtividade</button>
  <button data-aba="original" id="aba-original" hidden>Tela original</button>
</nav>
<main id="area"><div class="carregando-base">Carregando...</div></main>
<div id="modal" hidden><div class="modal-caixa larga" id="modal-corpo"></div></div>
<div id="avisos"></div>

<script src="../../nucleo/config.js?v=1.1.0"></script>
<script src="../../nucleo/api.js?v=1.1.0"></script>
<script>window.App = (window.parent && window.parent !== window) ? window.parent.App : null;</script>
<script src="../../nucleo/apoio.js?v=1.2.0"></script>
<script src="sistemas.js?v=1.1.0"></script>
<script src="motor.js?v=1.1.0"></script>
</body>
</html>
