<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apoio às Avaliações · Jornada do Aluno</title>
<link rel="icon" type="image/png" href="../../icones/icon-192.png">
<link rel="stylesheet" href="../../nucleo/estilo.css?v=1.2.0">
<style>
  body { background: var(--fundo); }
  [hidden] { display: none !important; }
  .topo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 22px; background: #fff; border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 5; }
  .topo h1 { font-size: 19px; margin: 0; } .topo small { display: block; color: var(--texto-2); font-size: 12px; }
  .topo .btn { margin-left: auto; }
  .abas { display: flex; gap: 4px; padding: 0 22px; background: #fff; border-bottom: 1px solid var(--borda); }
  .abas button { border: 0; background: none; padding: 11px 14px; font: inherit; font-weight: 600; color: var(--texto-2); cursor: pointer; border-bottom: 3px solid transparent; }
  .abas button.ativa { color: var(--azul); border-bottom-color: var(--verde); }
  .abas .cont { background: var(--azul-claro); color: var(--azul); border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }
  main { padding: 18px 22px; }
  .lembrete { background: #fff8e6; border: 1px solid #f2d48a; border-radius: 8px; padding: 9px 13px; font-size: 13px; margin-bottom: 14px; color: #6b5200; }
  .filtros { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .filtros input { width: auto; min-width: 260px; margin: 0; padding: 7px 10px; font-size: 13px; }
  .total { margin-left: auto; color: var(--texto-2); font-size: 13px; }
  .tabela td.nome b { display: block; } .tabela td.nome small { color: var(--texto-2); font-family: Consolas, monospace; }
  .tabela tr.clicavel { cursor: pointer; } .tabela tr.clicavel:hover td { background: #f7f9fc; }
  .chips span { display: inline-block; background: #eef3f9; border-radius: 10px; padding: 2px 8px; font-size: 11px; margin: 1px 3px 1px 0; }
  .vencida { color: var(--erro); font-weight: 700; }
  .modal-caixa.larga { max-width: 780px; }
  .grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .marcar { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin: 4px 0 10px; }
  .marcar label { display: flex; gap: 7px; align-items: center; font-weight: 400; font-size: 13px; margin: 0; }
  .marcar input { width: auto; margin: 0; }
  .secao { font-size: 13px; font-weight: 700; color: var(--azul); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .4px; }
  textarea { display: block; width: 100%; margin-top: 5px; padding: 9px 11px; border: 1px solid var(--borda); border-radius: 8px; font: inherit; min-height: 80px; }
  .carregando-base { padding: 40px; text-align: center; color: var(--texto-2); }
  @media (max-width: 820px) { .grade2, .marcar { grid-template-columns: 1fr; } main { padding: 14px 10px; } }
</style>
</head>
<body>
<div class="topo">
  <div><h1>🧩 Apoio às Avaliações</h1><small>Orientações do NAAP e do NAE para as avaliações e o uso da plataforma</small></div>
  <button class="btn primario" id="btn-novo">+ Nova orientação</button>
</div>
<nav class="abas" id="abas">
  <button data-aba="ativas" class="ativa">Ativas <span class="cont" id="c-ativas">0</span></button>
  <button data-aba="revisar">Para revisar <span class="cont" id="c-revisar">0</span></button>
  <button data-aba="encerradas">Encerradas <span class="cont" id="c-encerradas">0</span></button>
</nav>
<main id="area"><div class="carregando-base">Carregando...</div></main>
<div id="modal" hidden><div class="modal-caixa larga" id="modal-corpo"></div></div>
<div id="avisos"></div>

<script src="../../nucleo/config.js?v=1.2.0"></script>
<script src="../../nucleo/api.js?v=1.2.0"></script>
<script>window.App = (window.parent && window.parent !== window) ? window.parent.App : null;</script>
<script src="../../nucleo/apoio.js?v=1.2.0"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s), esc = Apoio.esc;
  const E = { lista: [], aba: 'ativas', busca: '' };
  const hoje = () => new Date().toISOString().slice(0, 10);
  const dataBR = (iso) => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1].slice(2)}` : ''; };
  const quando = (ms) => ms ? new Date(ms).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '';
  const aviso = (msg, tipo) => { if (window.App && window.App.aviso) return window.App.aviso(msg, tipo); alert(msg); };
  const precisaRevisar = (o) => o.ativo && (!o.revisao || o.revisao <= hoje());

  async function carregar() {
    try {
      const r = await Api.chamar('apoio.listar');
      if (!r || !r.ok) throw new Error((r && r.erro) || 'Não foi possível carregar.');
      E.lista = r.dados.sort((a, b) => String(a.aluno).localeCompare(String(b.aluno), 'pt-BR'));
    } catch (e) { if (!e.auth) aviso(e.message, 'erro'); E.lista = []; }
    desenhar();
  }

  function desenhar() {
    const grupos = { ativas: E.lista.filter((o) => o.ativo), revisar: E.lista.filter(precisaRevisar), encerradas: E.lista.filter((o) => !o.ativo) };
    Object.keys(grupos).forEach((k) => { $('#c-' + k).textContent = grupos[k].length; });
    document.querySelectorAll('#abas button').forEach((b) => b.classList.toggle('ativa', b.dataset.aba === E.aba));
    const b = E.busca.trim().toLowerCase();
    const lista = grupos[E.aba].filter((o) => !b || String(o.aluno).toLowerCase().indexOf(b) >= 0 || o.matricula.indexOf(b) >= 0);
    $('#area').innerHTML = `
      <div class="lembrete">Registre <b>o que fazer</b> na avaliação e na plataforma. Não registre diagnóstico, condição ou laudo: a equipe só precisa do direcionamento.</div>
      <div class="filtros"><input type="search" id="busca" placeholder="Buscar por nome ou matrícula" value="${esc(E.busca)}"><span class="total">${lista.length} aluno(s)</span></div>
      <div class="painel"><table class="tabela"><thead><tr><th>Aluno</th><th>Curso</th><th>Nas avaliações</th><th>Na plataforma</th><th>Revisão</th><th>Atualizado</th></tr></thead>
      <tbody>${lista.map((o) => `<tr class="clicavel" data-mat="${esc(o.matricula)}">
        <td class="nome"><b>${esc(o.aluno)}</b><small>${esc(o.matricula)}</small></td><td>${esc(o.curso)}</td>
        <td class="chips">${Apoio.itens(o).map((x) => `<span>${esc(x)}</span>`).join('')}</td>
        <td class="chips">${(o.plataforma || []).map((x) => `<span>${esc(x)}</span>`).join('')}</td>
        <td class="${precisaRevisar(o) ? 'vencida' : ''}">${o.revisao ? dataBR(o.revisao) : 'sem data'}</td>
        <td><small>${esc(o.quem)}<br>${quando(o.atualizado)}</small></td></tr>`).join('') || '<tr><td colspan="6" class="vazio">Nenhum aluno aqui.</td></tr>'}</tbody></table></div>`;
    const busca = $('#busca'); busca.oninput = () => { E.busca = busca.value; const pos = busca.selectionStart; desenhar(); const n = $('#busca'); n.focus(); n.setSelectionRange(pos, pos); };
    document.querySelectorAll('tr[data-mat]').forEach((tr) => { tr.onclick = () => abrir(E.lista.filter((o) => o.matricula === tr.dataset.mat)[0]); });
  }

  function revisaoPadrao() { const d = new Date(); d.setMonth(d.getMonth() + 6); return d.toISOString().slice(0, 10); }

  function abrir(o) {
    const novo = !o; o = o || { avaliacao: [], plataforma: [], ativo: true, revisao: revisaoPadrao() };
    const marcar = (lista, sel, nome) => lista.map((x) => `<label><input type="checkbox" name="${nome}" value="${esc(x)}" ${sel.indexOf(x) >= 0 ? 'checked' : ''}>${esc(x)}</label>`).join('');
    $('#modal-corpo').innerHTML = `
      <h2>${novo ? 'Nova orientação' : esc(o.aluno)}</h2>
      <form id="form-apoio">
        <div class="grade2">
          <label>Matrícula<input name="matricula" value="${esc(o.matricula || '')}" ${novo ? '' : 'readonly'} required inputmode="numeric"><small class="dica" id="busca-info">${novo ? 'Digite a matrícula: nome e curso vêm da base líquida.' : ''}</small></label>
          <label>Nome do aluno<input name="aluno" value="${esc(o.aluno || '')}" required></label>
          <label>Curso<input name="curso" value="${esc(o.curso || '')}"></label>
          <label>Revisar até<input type="date" name="revisao" value="${esc(o.revisao || '')}"></label>
        </div>
        <div class="secao">Nas avaliações</div>
        <div class="marcar">${marcar(Apoio.AVALIACAO, o.avaliacao || [], 'avaliacao')}</div>
        <label>Tempo adicional (quanto)<input name="tempo_adicional" value="${esc(o.tempo_adicional || '')}" placeholder="Ex.: 1 hora, ou 50% do tempo da prova"></label>
        <div class="secao">Na plataforma</div>
        <div class="marcar">${marcar(Apoio.PLATAFORMA, o.plataforma || [], 'plataforma')}</div>
        <label>Outras orientações para a equipe<textarea name="orientacoes" placeholder="Ex.: confirmar a sala com a coordenação do polo dois dias antes; preferir mensagens curtas e por escrito.">${esc(o.orientacoes || '')}</textarea></label>
        <div class="secao">Acompanhamento (só o NAAP/NAE vê)</div>
        <div class="grade2">
          <label>Responsável<input name="responsavel" value="${esc(o.responsavel || '')}" placeholder="NAAP ou NAE, e quem acompanha"></label>
          <label>Contato do responsável<input name="contato" value="${esc(o.contato || '')}"></label>
        </div>
        <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" name="ativo" style="width:auto;margin:0" ${o.ativo ? 'checked' : ''}> Orientação ativa (desmarque para encerrar)</label>
        <p class="dica">Não registre diagnóstico, condição ou laudo.${novo ? '' : ` Última atualização: ${esc(o.quem)}, ${quando(o.atualizado)}.`}</p>
        <div class="botoes"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn primario" id="btn-salvar">Salvar</button></div>
      </form>`;
    $('#modal').hidden = false;
    document.querySelector('[data-fechar]').onclick = fechar;
    if (novo) {
      // nome e curso preenchidos pela matrícula (bases líquidas Ímpar, Par e Técnico)
      const f = $('#form-apoio'), info = $('#busca-info');
      let ultima = '';
      const buscar = async () => {
        const m = f.matricula.value.replace(/\D/g, '');
        if (m.length < 9 || m === ultima) return;
        ultima = m;
        const ja = E.lista.filter((x) => x.matricula === m)[0];
        if (ja) { info.textContent = 'Este aluno já tem orientação cadastrada. Abrindo...'; setTimeout(() => abrir(ja), 600); return; }
        info.textContent = 'Procurando na base líquida...';
        try {
          const r = await Api.chamar('apoio.buscar_aluno', { matricula: m });
          if (m !== f.matricula.value.replace(/\D/g, '')) return;
          if (r && r.ok && r.aluno) { f.aluno.value = r.aluno; f.curso.value = r.curso; info.textContent = '✓ Encontrado na base ' + ({ impar: 'Ímpar', par: 'Par', ct: 'Técnico' }[r.base] || '') + '.'; }
          else info.textContent = 'Não encontrei na base líquida. Preencha o nome e o curso.';
        } catch (e) { if (!e.auth) info.textContent = 'Não foi possível procurar agora. Preencha o nome e o curso.'; }
      };
      f.matricula.addEventListener('blur', buscar);
      f.matricula.addEventListener('input', () => { if (f.matricula.value.replace(/\D/g, '').length >= 12) buscar(); });
    }
    $('#form-apoio').onsubmit = async (ev) => {
      ev.preventDefault();
      const f = ev.target, todos = (n) => [...f.querySelectorAll(`[name=${n}]:checked`)].map((x) => x.value);
      const registro = { matricula: f.matricula.value, aluno: f.aluno.value.trim(), curso: f.curso.value.trim(), revisao: f.revisao.value,
        avaliacao: todos('avaliacao'), tempo_adicional: f.tempo_adicional.value.trim(), plataforma: todos('plataforma'),
        orientacoes: f.orientacoes.value.trim(), responsavel: f.responsavel.value.trim(), contato: f.contato.value.trim(), ativo: f.ativo.checked };
      const b = $('#btn-salvar'); b.disabled = true; b.textContent = 'Salvando...';
      try {
        const r = await Api.chamar('apoio.salvar', { registro });
        if (!r || !r.ok) throw new Error((r && r.erro) || 'Não foi possível salvar.');
        aviso('Orientação salva.', 'ok'); fechar(); carregar();
      } catch (e) { if (!e.auth) aviso(e.message, 'erro'); b.disabled = false; b.textContent = 'Salvar'; }
    };
  }
  function fechar() { $('#modal').hidden = true; $('#modal-corpo').innerHTML = ''; }

  document.addEventListener('DOMContentLoaded', () => {
    if (!Api.Sessao.ler()) { if (window.App) window.App.mostrarLogin('Entre novamente.'); return; }
    document.querySelectorAll('#abas button').forEach((b) => { b.onclick = () => { E.aba = b.dataset.aba; desenhar(); }; });
    $('#btn-novo').onclick = () => abrir(null);
    $('#modal').onclick = (ev) => { if (ev.target.id === 'modal') fechar(); };
    carregar();
  });
  window.TelaApoio = { estado: E, abrir };
})();
</script>
</body>
</html>
